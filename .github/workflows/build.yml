name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q REACT-upload.zip
          chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Check merged manifest has no INTERNET permission
        run: |
          M=$(find app/build -name AndroidManifest.xml -path "*merged_manifests/debug*" | head -1)
          echo "Checking $M"
          if grep -q "android.permission.INTERNET" "$M"; then echo "INTERNET found!"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: REACT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK را روی شاخه‌ی جدا ذخیره می‌کند تا بدون ورود به GitHub هم قابل دریافت باشد.
      - name: Publish APK to branch built-apk
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/REACT.apk
          cd /tmp/out && git init -q -b built-apk
          git config user.name "build-bot" && git config user.email "bot@users.noreply.github.com"
          git add REACT.apk && git commit -qm "REACT debug APK"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" built-apk
